; php-fil-c image defaults
; OPcache is intentionally NOT enabled: the Fil-C port currently panics when
; OPcache persists certain classes (see README "Known limitations").
; The extension is still present if you want to experiment with
; -d zend_extension=opcache at your own risk.
opcache.enable=0
opcache.enable_cli=0

; The Fil-C build bakes in its build-time prefix; point at the image layout.
extension_dir=/usr/local/lib/php/extensions/no-debug-non-zts-20240924

; Sensible container defaults
expose_php=0
memory_limit=256M

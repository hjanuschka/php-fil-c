name: build-and-publish

# Builds Fil-C PHP images for every version in versions.json and publishes
# cli / fpm / apache / wordpress variants to GHCR. Triggered manually, on a
# `v*` tag, or on push to main. To ship a new PHP CVE fix: bump versions.json
# (version + sha256), drop the Fil-C patch, push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Only build this version (blank = all supported)"
        required: false
        default: ""
  push:
    tags: ['v*']
    branches: ['main']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  FILC_VERSION: "0.686"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - name: Build matrix from versions.json
        id: gen
        env:
          ONLY: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('versions.json'))
          only = os.environ.get('ONLY', '').strip()
          rows = []
          for v in data['versions']:
              if v.get('status') != 'supported':
                  continue
              if only and v['version'] != only:
                  continue
              for sapi in ('cli', 'fpm', 'apache', 'wordpress'):
                  rows.append({'version': v['version'], 'series': v['series'], 'sapi': sapi})
          print('include=' + json.dumps(rows))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('include=' + json.dumps(rows) + '\n')
          PY

  build:
    needs: matrix
    if: needs.matrix.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.sapi }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            FILC_VERSION=${{ env.FILC_VERSION }}
          push: true
          cache-from: type=gha,scope=${{ matrix.series }}
          cache-to: type=gha,scope=${{ matrix.series }},mode=max
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}-${{ matrix.sapi }}-bookworm
            ${{ env.IMAGE }}:${{ matrix.series }}-${{ matrix.sapi }}-bookworm
            ${{ env.IMAGE }}:${{ matrix.sapi }}-bookworm

      - name: Smoke test
        run: |
          docker pull ${{ env.IMAGE }}:${{ matrix.version }}-${{ matrix.sapi }}-bookworm
          case "${{ matrix.sapi }}" in
            cli)
              docker run --rm --entrypoint php ${{ env.IMAGE }}:${{ matrix.version }}-cli-bookworm \
                -r 'echo PHP_VERSION, " ok upload_progress=", (ini_get("session.upload_progress.enabled") ? "ON" : "0"), "\n";' ;;
            fpm)
              docker run --rm --entrypoint /usr/local/sbin/php-fpm ${{ env.IMAGE }}:${{ matrix.version }}-fpm-bookworm \
                -t -y /usr/local/etc/php-fpm.conf ;;
            apache|wordpress)
              docker run --rm --entrypoint /opt/fil/apache/bin/httpd ${{ env.IMAGE }}:${{ matrix.version }}-${{ matrix.sapi }}-bookworm -v ;;
          esac
